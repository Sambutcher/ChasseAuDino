# Conversion de RTMPose-m (posture animale AP-10K) en TensorFlow.js (TensorFlow exige l'AVX,
# absent du PC de dev). Résultat : artefact « rtmpose-ap10k-tfjs » à copier dans models/.
# Lancement manuel : gh workflow run export-posture.yml -R Sambutcher/ChasseAuDino --ref <branche>
name: Export du modèle de posture

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer onnx2tf, ONNX Runtime et tensorflowjs
        run: |
          pip install "tensorflow==2.17.1" "tf_keras==2.17.0" "onnx==1.16.1" "onnxruntime==1.18.1" \
            "onnx2tf==1.25.7" onnx_graphsurgeon sng4onnx psutil "tensorflowjs==4.22.0" numpy pillow
      - name: Exporter
        run: tools/export_posture.sh
      - name: Vérifier avec TF.js
        run: |
          npm install --no-save @tensorflow/tfjs-node@4.22.0
          node tools/check_posture.mjs models/rtmpose-ap10k models/rtmpose-reference
      - uses: actions/upload-artifact@v4
        with:
          name: rtmpose-ap10k-tfjs
          path: |
            models/rtmpose-ap10k/
            models/rtmpose-reference/
