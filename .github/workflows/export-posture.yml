# Préparation de RTMPose-m (posture animale AP-10K) pour ONNX Runtime Web : modèle figé,
# version int8, comparaison avec float32. Résultat : artefact « rtmpose-onnx » à copier dans models/.
# Lancement manuel : gh workflow run export-posture.yml -R Sambutcher/ChasseAuDino --ref <branche>
name: Export du modèle de posture

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer ONNX, onnxsim et ONNX Runtime
        run: pip install "onnx==1.16.1" "onnxsim==0.4.36" "onnxruntime==1.20.1" numpy pillow
      - name: Préparer et comparer
        timeout-minutes: 20
        run: tools/export_posture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtmpose-onnx
          path: models/rtmpose-onnx/
