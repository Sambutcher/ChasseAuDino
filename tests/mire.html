<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mire de test</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 16px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0 0 16px; color: #aaa; }
    #grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    figure { margin: 0; background: #1c1c1c; border-radius: 8px; overflow: hidden; }
    canvas { display: block; width: 100%; height: auto; cursor: zoom-in; }
    figcaption { padding: 8px 10px; font-size: 13px; line-height: 1.4; }
    .res { font-weight: 600; }
    .ok { color: #2ecc40; }
    .ko { color: #ff6b5b; }
    figcaption a { color: #888; }
    #plein { position: fixed; inset: 0; background: #000; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
    #plein img { max-width: 100%; max-height: 100%; }
    section { margin-top: 32px; }
    h2 { font-size: 18px; margin: 0 0 4px; }
    section p { color: #aaa; margin: 0 0 12px; }
    table { border-collapse: collapse; font-size: 13px; width: 100%; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #333; text-align: center; }
    td:first-child, th:first-child { text-align: left; }
    td.ok { color: #2ecc40; }
    td.ko { color: #ff6b5b; }
  </style>
  <script src="../vendor/tf.min.js"></script>
</head>
<body>
  <header>
    <h1>Mire de test</h1>
    <p id="statut">Chargement du modèle…</p>
  </header>
  <div id="grille"></div>
  <div id="plein"><img alt=""></div>

  <script type="module">
    import { chargerDetecteur, detecter } from '../js/detector.js';
    import { letterbox, versEcran, ronds, zoneDetection } from '../js/geometry.js';

    // Photos Wikimedia Commons (licences libres, voir les liens sous chaque image).
    const IMAGES = [
      ['Feu tricolore à Paris', 'a/ad/Feu_tricolore_%C3%A0_Paris.JPG'],
      ['Champs-Élysées, rond-point Dassault', '5/5a/D%C3%A9tail_feu_tricolore_rond-point_Champs_%C3%89lys%C3%A9es_Dassault_Paris_1.jpg'],
      ['Rue d\'Allier, Moulins', 'b/be/Rue_d%27Allier_feu_tricolore_rouge-jaune-jaune_%28Moulins%29_2015-08-26.JPG'],
      ['Saint-Thurin, RD 1089', '7/72/Saint-Thurin_-_Feu_tricolore_vert_sur_la_RD_1089_%28juin_2023%29.jpg'],
      ['Tunnel du Galibier', '6/6f/Tunnel_du_Galibier_et_feu_tricolore_sud_%28septembre_2024%29.JPG'],
      ['Nancras', '8/83/FR_17_Nancras_-_Feu_tricolore%2C_panneaux_AB6_et_B2b%2C_panonceau.jpg'],
      ['Feu cycliste, Denfert-Rochereau', '3/36/Feu_Tricolore_Cyclistes_Place_Denfert_Rochereau_-_Paris_XIV_%28FR75%29_-_2024-11-10_-_1.jpg'],
      ['Daloa (Côte d\'Ivoire)', '9/97/20240522_-_Daloa_-_Feu_tricolore.jpg'],
      ['Feu horizontal, La Rochelle', '4/49/FR_17_La_Rochelle_-_Feu_tricolore_horizontal_-_De_jour_-_Rouge.jpg'],
    ];
    const miniature = (chemin) => {
      const nom = chemin.split('/').pop();
      return `https://upload.wikimedia.org/wikipedia/commons/thumb/${chemin}/960px-${nom}`;
    };
    const page = (chemin) => `https://commons.wikimedia.org/wiki/File:${chemin.split('/').pop()}`;

    const statut = document.getElementById('statut');
    const grille = document.getElementById('grille');
    const plein = document.getElementById('plein');
    plein.addEventListener('click', () => { plein.style.display = 'none'; });

    function charger(src) {
      return new Promise((ok, ko) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => ok(img);
        img.onerror = () => ko(new Error('image introuvable'));
        img.src = src;
      });
    }

    function dessiner(ctx, boites) {
      for (const b of boites) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ff3b30';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        // Les 3 ronds tels que le jeu les placerait.
        for (const r of ronds(b)) {
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, 2 * Math.PI);
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#fff';
          ctx.stroke();
        }
        const texte = b.score.toFixed(2);
        ctx.font = '600 22px system-ui, sans-serif';
        const w = ctx.measureText(texte).width + 10;
        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(b.x, b.y - 28, w, 28);
        ctx.fillStyle = '#fff';
        ctx.fillText(texte, b.x + 5, b.y - 7);
      }
    }

    const entree = await chargerDetecteur('../models/yolo11n/model.json');
    const canvasEntree = document.createElement('canvas');
    canvasEntree.width = entree.largeur;
    canvasEntree.height = entree.hauteur;
    const ctxEntree = canvasEntree.getContext('2d', { willReadFrequently: true });
    statut.textContent = `Modèle chargé (entrée ${entree.largeur}×${entree.hauteur}, backend ${tf.getBackend()}). `
      + 'Cadres rouges : feux détectés ; cercles blancs : cible du jeu. Clic sur une image : plein écran, à viser avec l\'iPhone.';

    let trouves = 0;
    for (const [titre, chemin] of IMAGES) {
      const figure = document.createElement('figure');
      const canvas = document.createElement('canvas');
      const legende = document.createElement('figcaption');
      legende.innerHTML = `<span class="res">Analyse…</span><br>${titre} · <a href="${page(chemin)}" target="_blank" rel="noopener">source</a>`;
      figure.append(canvas, legende);
      grille.append(figure);
      const res = legende.querySelector('.res');

      try {
        const img = await charger(miniature(chemin));
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        canvas.addEventListener('click', () => {
          plein.querySelector('img').src = img.src;
          plein.style.display = 'flex';
        });

        // Même préparation que le jeu, sur l'image entière (sans zoom).
        const lb = letterbox(img.naturalWidth, img.naturalHeight, entree.largeur, entree.hauteur);
        ctxEntree.fillStyle = 'rgb(114,114,114)';
        ctxEntree.fillRect(0, 0, entree.largeur, entree.hauteur);
        ctxEntree.drawImage(img, lb.dx, lb.dy, lb.dw, lb.dh);
        const t0 = performance.now();
        const boites = await detecter(canvasEntree);
        const ms = performance.now() - t0;
        const ecran = boites.map((b) => ({ ...versEcran(b, lb, img.naturalWidth, img.naturalHeight), score: b.score }));
        dessiner(ctx, ecran);

        if (ecran.length) trouves++;
        res.className = `res ${ecran.length ? 'ok' : 'ko'}`;
        res.textContent = ecran.length
          ? `${ecran.length} feu${ecran.length > 1 ? 'x' : ''} (${ecran.map((b) => b.score.toFixed(2)).join(', ')}) · ${ms.toFixed(0)} ms`
          : `Aucun feu détecté · ${ms.toFixed(0)} ms`;
      } catch (e) {
        res.className = 'res ko';
        res.textContent = `Erreur : ${e.message}`;
      }
    }
    statut.textContent += ` — Détecté sur ${trouves}/${IMAGES.length} images.`;

    // Mode distance : la photo réduite (feu plus lointain) au centre d'un fond gris de même
    // taille, analysée en vue entière puis sur la zone centrale comme le fait le jeu.
    const ECHELLES = [1, 0.5, 0.25];
    const section = document.createElement('section');
    section.innerHTML = '<h2>Distance</h2><p>Meilleur score « traffic light » (vide = non détecté). '
      + 'Vue = image entière dans le modèle ; Centre = zone centrale (moitié de la hauteur), comme le jeu.</p>';
    const tableau = document.createElement('table');
    tableau.id = 'distance';
    tableau.innerHTML = `<thead><tr><th>Photo</th>${ECHELLES.map((e) => `<th>${e * 100} % vue</th><th>${e * 100} % centre</th>`).join('')}</tr></thead><tbody></tbody>`;
    section.append(tableau);
    document.body.append(section);
    const vue = document.createElement('canvas');
    const ctxVue = vue.getContext('2d');
    const ratio = entree.largeur / entree.hauteur;
    const totaux = ECHELLES.map(() => ({ vue: 0, centre: 0 }));

    async function meilleurScore(source, z) {
      const lb = letterbox(z.w, z.h, entree.largeur, entree.hauteur);
      ctxEntree.fillStyle = 'rgb(114,114,114)';
      ctxEntree.fillRect(0, 0, entree.largeur, entree.hauteur);
      ctxEntree.drawImage(source, z.x, z.y, z.w, z.h, lb.dx, lb.dy, lb.dw, lb.dh);
      const boites = await detecter(canvasEntree);
      return boites.length ? Math.max(...boites.map((b) => b.score)) : null;
    }

    for (const [titre, chemin] of IMAGES) {
      const ligne = document.createElement('tr');
      ligne.innerHTML = `<td>${titre}</td>`;
      tableau.tBodies[0].append(ligne);
      let img;
      try { img = await charger(miniature(chemin)); } catch { continue; }
      vue.width = img.naturalWidth;
      vue.height = img.naturalHeight;
      for (const [i, e] of ECHELLES.entries()) {
        ctxVue.fillStyle = 'rgb(128,128,128)';
        ctxVue.fillRect(0, 0, vue.width, vue.height);
        const w = vue.width * e;
        const h = vue.height * e;
        ctxVue.drawImage(img, (vue.width - w) / 2, (vue.height - h) / 2, w, h);
        const sVue = await meilleurScore(vue, { x: 0, y: 0, w: vue.width, h: vue.height });
        const sCentre = await meilleurScore(vue, zoneDetection(null, vue.width, vue.height, ratio, 1));
        if (sVue !== null) totaux[i].vue++;
        if (sCentre !== null) totaux[i].centre++;
        ligne.insertAdjacentHTML('beforeend',
          `<td class="${sVue !== null ? 'ok' : 'ko'}">${sVue?.toFixed(2) ?? '—'}</td>`
          + `<td class="${sCentre !== null ? 'ok' : 'ko'}">${sCentre?.toFixed(2) ?? '—'}</td>`);
      }
    }
    const pied = document.createElement('tr');
    pied.id = 'totaux';
    pied.innerHTML = `<th>Détectés / ${IMAGES.length}</th>${totaux.map((t) => `<th>${t.vue}</th><th>${t.centre}</th>`).join('')}`;
    tableau.append(pied);
  </script>
</body>
</html>
