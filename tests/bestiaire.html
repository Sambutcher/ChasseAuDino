<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Bestiaire</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3a5a40; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
    /* Fond façon trottoir pour juger les couleurs hors caméra. */
    body { background: linear-gradient(#8fb8de 0 55%, #7c7466 55% 100%); }
    #creatures, #viseur { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #viseur { touch-action: none; }
    #outils { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 6px;
      justify-content: center; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); background: rgba(0,0,0,0.55); }
    button { font: 600 15px -apple-system, system-ui, sans-serif; padding: 8px 12px; border: 0; border-radius: 18px;
      background: #333; color: #fff; }
    button.choisi { background: #d4a017; color: #000; }
    #etat { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
      font-weight: 600; text-shadow: 0 1px 3px #000; }
  </style>
</head>
<body>
  <canvas id="creatures"></canvas>
  <canvas id="viseur"></canvas>
  <p id="etat">Chargement des créatures…</p>
  <div id="outils"></div>
  <script type="module">
    // Bac à sable des créatures : une boîte fixe tient lieu d'animal détecté.
    // Tap = tir au viseur (centre) ; boutons pour forcer l'explosion ou la fuite.
    import { creerCreatures } from '../js/creatures.js';
    import { creerSons } from '../js/sons.js';
    import { ESPECES, messageIssue } from '../js/especes.js';

    const etatTexte = document.getElementById('etat');
    const outils = document.getElementById('outils');
    const viseur = document.getElementById('viseur');
    const sons = creerSons();
    const creatures = await creerCreatures(document.getElementById('creatures'), {
      base: '../', quandHumeur: (e) => sons.humeur(e.ton),
    });

    let classe = 19;
    let issue = null;
    const boite = () => {
      const w = innerWidth * 0.55;
      const h = innerHeight * 0.4;
      return { x: (innerWidth - w) / 2, y: innerHeight * 0.32, w, h };
    };

    const boutons = {};
    const bouton = (texte, action) => {
      const b = document.createElement('button');
      b.textContent = texte;
      b.addEventListener('click', () => { sons.debloquer(); action(); });
      outils.append(b);
      return b;
    };
    function choisir(c) {
      classe = c;
      issue = null;
      creatures.cacher();
      for (const [k, b] of Object.entries(boutons)) b.classList.toggle('choisi', Number(k) === c);
      const e = ESPECES[c];
      etatTexte.textContent = `${e.animal} → ${e.nom} (${e.ton === 'kawaii' ? 'kawaii' : 'méchant'})`;
    }
    for (const [c, e] of Object.entries(ESPECES)) boutons[c] = bouton(e.nom, () => choisir(Number(c)));
    const finir = (nouvelle) => {
      if (issue) return;
      issue = nouvelle;
      const { ton } = ESPECES[classe];
      sons.tir();
      if (issue === 'explosee') { creatures.exploser(); sons.explosion(ton); }
      else { creatures.fuir(); sons.fuite(ton); }
      etatTexte.textContent = messageIssue(ESPECES[classe], issue);
      setTimeout(() => choisir(classe), 2200);
    };
    bouton('💥 Exploser', () => finir('explosee'));
    bouton('🏃 Fuir', () => finir('enfuie'));

    viseur.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      sons.debloquer();
      if (issue) return;
      finir(creatures.touche({ x: innerWidth / 2, y: innerHeight / 2 }) ? 'explosee' : 'enfuie');
    });

    // Croix de visée au centre.
    const ctx = viseur.getContext('2d');
    function dessinerViseur() {
      const dpr = devicePixelRatio || 1;
      viseur.width = innerWidth * dpr;
      viseur.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, 30, 0, 2 * Math.PI);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        ctx.moveTo(cx + dx * 9, cy + dy * 9);
        ctx.lineTo(cx + dx * 42, cy + dy * 42);
      }
      ctx.stroke();
    }
    addEventListener('resize', dessinerViseur);
    dessinerViseur();

    choisir(classe);
    function image(t) {
      if (!issue) creatures.montrer(classe, boite(), t);
      creatures.dessiner(t);
      requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
  </script>
</body>
</html>
